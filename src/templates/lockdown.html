{% extends 'base.html' %}

{% block content %}
    <section class="container mh">
        <h1 class="super-title">Accès refusé</h1>
        <form method="post" action="/login" class="form">
            <div>
                <label for="password">Mot de passe</label>
                <div>
                    <input type="password" name="password" required>
                    <button type="button" class="btn btn-icon show-password"><i class="nf nf-fa-eye"></i></button>
                </div>
            </div>
            <button type="submit" class="btn">Se connecter</button>
        </form>
    </section>
{% endblock %}
